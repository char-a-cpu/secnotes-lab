server {
    # 1. Escuchar en el puerto estándar HTTP
    listen 80;

    # 2. Configuración para servir la SPA de React
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Si la ruta no existe físicamente, redirige a index.html (React Router)
        try_files $uri $uri/ /index.html;
    }

    # 3. Proxy inverso: reenviar tráfico de la API al backend dentro de K8s
    location /api/ {
        # 'backend-service' será el nombre del Service en Kubernetes (DNS interno)
        proxy_pass http://backend-service:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
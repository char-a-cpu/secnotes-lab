name: CI/CD & DevSecOps Pipeline

# 1. Se ejecuta automáticamente en cada push a la rama main
on:
  push:
    branches: [ main ]

# 2. Permisos requeridos para que Workload Identity Federation pueda solicitar el token OIDC
permissions:
  contents: read
  id-token: write

env:
  GAR_LOCATION: us-central1
  REPO_NAME: repo

jobs:
  # ========================================================
  # ETAPA 1: Construcción Funcional y Auditoría DevSecOps
  # ========================================================
  build-and-audit:
    name: Build & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      # Validación de sintaxis en Backend
      - name: Validar Backend
        run: |
          cd backend
          npm install
          node --check index.js

      # Compilación de la SPA de React
      - name: Validar Frontend (Build)
        run: |
          cd frontend
          npm install
          npm run build

      # --- Escaneo DevSecOps: Dependencias vulnerables (OWASP A06) ---
      - name: Auditoría de Dependencias (SCA)
        run: |
          cd backend && npm audit --audit-level=high || true
          cd ../frontend && npm audit --audit-level=high || true
        continue-on-error: true

      # --- Escaneo DevSecOps: Código Estático (SAST con Semgrep) ---
      - name: Escaneo SAST con Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
        continue-on-error: true

  # ========================================================
  # ETAPA 2: Despliegue hacia Google Kubernetes Engine (GKE)
  # ========================================================
  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: build-and-audit # Solo se ejecuta si la etapa 1 compiló con éxito

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # 1. Autenticación OIDC con Google Cloud (Sin llaves JSON fijas)
      - name: Autenticar con GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      # 2. Configurar herramientas de Google Cloud
      - name: Configurar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 3. Configurar autenticación para Docker contra Artifact Registry
      - name: Configurar Docker para Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      # 4. Obtener acceso al clúster de Kubernetes
      - name: Conectar con GKE
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER_NAME }}
          location: ${{ secrets.GKE_REGION }}

      # 5. Construir y publicar las imágenes Docker usando el commit SHA como etiqueta
      - name: Construir y Subir Imágenes Docker
        run: |
          BACKEND_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/secnotes-backend:${{ github.sha }}"
          FRONTEND_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/secnotes-frontend:${{ github.sha }}"

          docker build -t $BACKEND_TAG ./backend
          docker push $BACKEND_TAG

          docker build -t $FRONTEND_TAG ./frontend
          docker push $FRONTEND_TAG

      # 6. Actualizar las imágenes de los Deployments en Kubernetes
      - name: Actualizar despliegue en Kubernetes
        env:
          NAMESPACE: app-note #Namespace definido en GKE
        run: |
          # Definir los tags completos hacia el Artifact Registry
          BACKEND_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/secnotes-backend:${{ github.sha }}"
          FRONTEND_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/secnotes-frontend:${{ github.sha }}"
          # Actualizar el deployment indicando el contenedor y la imagen en un namespace
          kubectl set image deployment/backend-deployment backend=$BACKEND_TAG -n $NAMESPACE
          kubectl set image deployment/frontend-deployment frontend=$FRONTEND_TAG -n $NAMESPACE

          # Confirmar que la actualización gradual (rolling update) finalizó sin caídas
          kubectl rollout status deployment/backend-deployment -n $NAMESPACE
          kubectl rollout status deployment/frontend-deployment -n $NAMESPACE
